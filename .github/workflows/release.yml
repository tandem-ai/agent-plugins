# The skills, as one download, published whenever the version changes.
#
# Nobody receiving this is going to clone the repo and run npm, so the archive
# has to exist as a release asset.
#
# TRIGGERED BY THE VERSION, NOT BY A TAG. A release nobody remembers to tag is a
# release that does not happen, and the manifests already carry the version that
# `npm run check` keeps aligned. Bumping it in a merged commit is the whole
# ceremony; the tag is created here from that commit. Doing both in one job is
# also what makes it work at all: a tag pushed with the default token does not
# trigger another workflow, so a separate tag-then-release pair would stall.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Read the version, and stop if it is already released
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          if git rev-parse "v${version}" >/dev/null 2>&1; then
            echo "v${version} is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Build first, then check. `variants/` is generated and untracked, so a
      # fresh clone has none and `check` alone would call them all stale; the
      # build writes them, and the check then does the job it is here for —
      # refusing a release whose mirror is stale or whose manifest versions
      # disagree. No install step: the scripts use node and zip only.
      - if: steps.version.outputs.release == 'true'
        run: npm run build

      - if: steps.version.outputs.release == 'true'
        run: npm run check

      - if: steps.version.outputs.release == 'true'
        run: npm run package:plugin

      - if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: dist/plugin/tandem-plugin.zip
          fail_on_unmatched_files: true
          body: |
            **Install for one person:** add the marketplace `tandem-ai/agent-plugins`
            in your assistant, or add the connector `https://api.usetandem.ai/mcp`.

            **Install for an organization**, no repository needed:

            Download `tandem-plugin.zip` — it contains the full plugin (connector
            config, skills, assets).

            1. **Claude Desktop:** extract the zip, then add the connector URL
               `https://api.usetandem.ai/mcp` in Organization → Connectors, and
               upload the skill folders from `tandem-plugin/skills/` in
               Organization → Skills.
            2. **Every other platform:** the connector URL and skills from the zip
               follow the same per-platform steps.

            Capabilities come from the connector at run time, so new and changed
            Tandem tools reach every client with no update on your side. These
            archives only change when the plugin contents do.
